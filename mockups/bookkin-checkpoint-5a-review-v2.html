      'first-run': [

        ['2', 'First-run guidance stays brief; the persistent actions remain available without a setup checklist.'],
        ['3', 'Add first book opens the same reusable add sheet used everywhere else.']

      history: [
        ['1', 'Book identity and large editorial type remain prominent without returning to the beige palette.'],

          <button type="button" data-go="shelf" ${current === 'shelf' ? 'aria-current="page"' : ''}>Shelf</button>
        </nav>
        <span class="bk2-alpha">Private alpha</span>
      </header>
      ${content}
      <div class="bk2-action-dock" data-note="${current === 'history' ? '2' : '3'}">
        <button class="bk2-dock-secondary" type="button" data-open="add">＋ Add book</button>
        <button class="bk2-dock-primary" type="button" data-open="log">Quick log</button>
      </div>
    `;

    const bookCard = (book, index) => `
      <article data-book-card data-title="${book.title.toLowerCase()}" data-author="${book.author.toLowerCase()}" data-status="${book.status}" ${index === 1 ? 'data-note="4"' : ''}>
        <button class="bk2-book-button" type="button" data-go="history" aria-label="Open ${book.title} history">
          <span class="bk2-cover ${book.cover ? 'bk2-cover-provider' : ''}">
            ${book.cover ? '<span>Verified provider cover</span>' : `<span>${book.title}<br><small>Cover unavailable</small></span>`}
          </span>
          <span class="bk2-book-name">${book.title}</span>
          <span class="bk2-meta">${book.author}</span>
          <span class="bk2-chip">${book.status}</span>
        </button>
      </article>
    `;

    const shelfScreen = () => shell(`
      <main class="bk2-page">
        <p class="bk2-kicker">Family shelf</p>
        <h1 class="bk2-title">Books worth remembering.</h1>
        <span class="bk2-count" data-count>${books.length} books</span>
        <section class="bk2-library-tools" aria-label="Find and filter shelf books" data-note="2">
          <input class="bk2-search" type="search" data-shelf-search placeholder="Search title or author" value="${shelfQuery}">
          <div class="bk2-filters" aria-label="Shelf status">
            ${['All', 'Owned', 'Borrowed', 'Wishlist'].map((value) => `<button class="bk2-filter" type="button" data-filter="${value}" aria-pressed="${shelfFilter === value}">${value}</button>`).join('')}
          </div>
        </section>
        <section class="bk2-books" aria-label="Family books">
          ${books.map(bookCard).join('')}
          <p class="bk2-no-results" data-no-results hidden>No books match that search and filter.</p>
        </section>
      </main>
    `, 'shelf');

    const firstRunScreen = () => shell(`
      <main class="bk2-page bk2-first-run">
        <section data-note="2">
          <p class="bk2-kicker">Start here</p>
          <h1 class="bk2-title">Start with books you already know.</h1>
          <p class="bk2-lede">Add a few books your family has tried, then record what happened. Those reactions and rereads will help Bookkin build better library bags later.</p>
        </section>
        <aside class="bk2-first-card" data-note="3">
          <p class="bk2-kicker">First book</p>
          <h2>Add one your family remembers.</h2>
          <p class="bk2-meta">Search by ISBN, title, or author.</p>
          <button class="bk2-primary" type="button" data-open="add">Add first book</button>
        </aside>
      </main>
    `, 'first-run');

    const historyScreen = () => shell(`
      <main class="bk2-page bk2-history">
        <button class="bk2-secondary" type="button" data-go="shelf">Back to shelf</button>
        <p class="bk2-kicker">Reading history</p>
        <h1 class="bk2-title">A small record of what happened.</h1>
        <section class="bk2-history-grid" data-note="1">
          <div class="bk2-cover"><span>More Pies!<br><small>Cover unavailable</small></span></div>
          <div>
            <p class="bk2-kicker">Family book</p>
            <h2>More Pies!</h2>
            <span class="bk2-meta">Robert Munsch</span>
            <span class="bk2-chip">Borrowed</span>
            <span class="bk2-chip">1 reread</span>
          </div>
        </section>
        <section class="bk2-timeline">
          <p class="bk2-kicker">Activity</p>
          <h2>What your family remembers.</h2>
          <article class="bk2-event">
            <span class="bk2-meta">Aug 7, 2026</span>
            <strong>Read again</strong>
            <span class="bk2-meta">Child: Love · Parent: Love</span>
          </article>
        </section>
      </main>
    `, 'history');

    const addSheet = () => `
      <div class="bk2-backdrop" data-overlay-backdrop>
        <section class="bk2-sheet" role="dialog" aria-modal="true" aria-labelledby="bk2-add-heading" data-note="1">
          <div class="bk2-sheet-head">
            <div>
              <p class="bk2-kicker">Add a book</p>
              <h2 id="bk2-add-heading">Find a verified record.</h2>
            </div>
            <button class="bk2-close" type="button" data-close aria-label="Close add book">Close</button>
          </div>
          <div class="bk2-tabs" role="tablist" aria-label="Discovery method" data-note="2">
            <button class="bk2-tab" type="button" role="tab" data-tab="ISBN" aria-selected="true">ISBN</button>
            <button class="bk2-tab" type="button" role="tab" data-tab="Title" aria-selected="false">Title</button>
            <button class="bk2-tab" type="button" role="tab" data-tab="Author" aria-selected="false">Author</button>
          </div>
          <label class="bk2-field-label" for="bk2-add-query">ISBN-10 or ISBN-13</label>
          <input class="bk2-search" id="bk2-add-query" placeholder="978-0-306-40615-7">
          <button class="bk2-primary" type="button" data-save>Look up book</button>
          <p class="bk2-scan-note" data-note="3">Camera barcode scanning will join this same add flow in Checkpoint 9 after the protected HTTPS preview is available.</p>
          <p class="bk2-confirm" data-confirm hidden>Prototype: verified result would appear here.</p>
        </section>
      </div>
    `;

    const logSheet = () => `
      <div class="bk2-backdrop" data-overlay-backdrop>
        <section class="bk2-sheet" role="dialog" aria-modal="true" aria-labelledby="bk2-log-heading">
          <div class="bk2-sheet-head">
            <div>
              <p class="bk2-kicker">Quick log</p>
              <h2 id="bk2-log-heading">What happened?</h2>
            </div>
            <button class="bk2-close" type="button" data-close aria-label="Close quick log">Close</button>
          </div>
          <label class="bk2-field-label" for="bk2-log-search">Choose a recent book or search your shelf</label>
          <input class="bk2-search" id="bk2-log-search" placeholder="Search title or author" data-note="1">
          <div class="bk2-recent-grid" data-note="1">
            <button class="bk2-recent" type="button" aria-pressed="true">More Pies!<span class="bk2-meta">Borrowed</span></button>
            <button class="bk2-recent" type="button" aria-pressed="false">The Snowy Day<span class="bk2-meta">Owned</span></button>
            <button class="bk2-recent" type="button" aria-pressed="false">Saturday<span class="bk2-meta">Owned</span></button>
          </div>
          <div data-note="2">
            <p class="bk2-choice-label">Reading event</p>
            <div class="bk2-choice-grid">
              <button class="bk2-choice" type="button" aria-pressed="true">Finished</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Read again</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Stopped</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Rejected</button>
            </div>
          </div>
          <div data-note="3">
            <p class="bk2-choice-label">Child’s reaction <span class="bk2-meta">optional</span></p>
            <div class="bk2-choice-grid">
              <button class="bk2-choice" type="button" aria-pressed="false">Love</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Like</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Not for me</button>
            </div>
            <p class="bk2-choice-label">Parent’s reaction <span class="bk2-meta">optional</span></p>
            <div class="bk2-choice-grid">
              <button class="bk2-choice" type="button" aria-pressed="false">Love</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Like</button>
              <button class="bk2-choice" type="button" aria-pressed="false">Dislike</button>
            </div>
          </div>
          <button class="bk2-primary" type="button" data-save>Save reading moment</button>
          <p class="bk2-confirm" data-confirm hidden>Prototype: reading moment saved.</p>
        </section>
      </div>
    `;

    function currentComments() {
      return comments[overlay || screen];
    }

    function renderNotes() {
      notesRegion.innerHTML = currentComments().map(([number, text]) => `
        <button class="btn btn-ghost bk2-note-button" type="button" data-select-note="${number}" aria-pressed="${activeNote === number}">
          <strong>${number}.</strong>&nbsp;${text}
        </button>
      `).join('');
      root.querySelector('.bk2-notes').hidden = !notesToggle.checked;
    }

    function applyShelfFilters() {
      if (screen !== 'shelf') return;
      let visible = 0;
      prototype.querySelectorAll('[data-book-card]').forEach((card) => {
        const textMatches = !shelfQuery || card.dataset.title.includes(shelfQuery) || card.dataset.author.includes(shelfQuery);
        const statusMatches = shelfFilter === 'All' || card.dataset.status === shelfFilter;
        card.hidden = !(textMatches && statusMatches);
        if (!card.hidden) visible += 1;
      });
      prototype.querySelector('[data-no-results]').hidden = visible !== 0;
      prototype.querySelector('[data-count]').textContent = `${visible} ${visible === 1 ? 'book' : 'books'}`;
    }

    function render() {
      prototype.innerHTML = screen === 'shelf' ? shelfScreen() : screen === 'first-run' ? firstRunScreen() : historyScreen();
      if (overlay === 'add') prototype.insertAdjacentHTML('beforeend', addSheet());
      if (overlay === 'log') prototype.insertAdjacentHTML('beforeend', logSheet());
      prototype.classList.toggle('bk2-annotations', notesToggle.checked);
      device.className = `bk2-device bk2-${viewport}`;
      activeNote = null;
      applyShelfFilters();
      renderNotes();
    }

    function chooseScreen(next) {
      screen = next;
      overlay = null;
      root.querySelectorAll('[data-screen]').forEach((button) => {
        const selected = button.dataset.screen === next;
        button.setAttribute('aria-pressed', String(selected));
        button.classList.toggle('btn-primary', selected);
      });
      render();
    }

    root.addEventListener('input', (event) => {
      if (event.target.matches('[data-shelf-search]')) {
        shelfQuery = event.target.value.trim().toLowerCase();
        applyShelfFilters();
      }
    });

    root.addEventListener('click', (event) => {
      const screenButton = event.target.closest('[data-screen]');
      if (screenButton) {
        chooseScreen(screenButton.dataset.screen);
        return;
      }

      const viewportButton = event.target.closest('[data-viewport]');
      if (viewportButton) {
        viewport = viewportButton.dataset.viewport;
        root.querySelectorAll('[data-viewport]').forEach((button) => {
          const selected = button.dataset.viewport === viewport;
          button.setAttribute('aria-pressed', String(selected));
          button.classList.toggle('btn-primary', selected);
        });
        render();
        return;
      }

      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        shelfFilter = filterButton.dataset.filter;
        prototype.querySelectorAll('[data-filter]').forEach((button) => button.setAttribute('aria-pressed', String(button === filterButton)));
        applyShelfFilters();
        return;
      }

      const goButton = event.target.closest('[data-go]');
      if (goButton) {
        chooseScreen(goButton.dataset.go);
        return;
      }

      const openButton = event.target.closest('[data-open]');
      if (openButton) {
        overlay = openButton.dataset.open;
        render();
        return;
      }

      if (event.target.closest('[data-close]') || event.target.matches('[data-overlay-backdrop]')) {
        overlay = null;
        render();
        return;
      }

      const tabButton = event.target.closest('[data-tab]');
      if (tabButton) {
        const sheet = tabButton.closest('.bk2-sheet');
        sheet.querySelectorAll('[data-tab]').forEach((button) => button.setAttribute('aria-selected', String(button === tabButton)));
        const label = sheet.querySelector('.bk2-field-label');
        const field = sheet.querySelector('.bk2-search');
        const save = sheet.querySelector('[data-save]');
        const values = {
          ISBN: ['ISBN-10 or ISBN-13', '978-0-306-40615-7', 'Look up book'],
          Title: ['Book title', 'The Snowy Day', 'Search by title'],
          Author: ['Author name', 'Ezra Jack Keats', 'Search by author']
        };
        [label.textContent, field.placeholder, save.textContent] = values[tabButton.dataset.tab];
        return;
      }

      const selectable = event.target.closest('.bk2-choice, .bk2-recent');
      if (selectable) {
        selectable.parentElement.querySelectorAll('.bk2-choice, .bk2-recent').forEach((button) => button.setAttribute('aria-pressed', String(button === selectable)));
        return;
      }

      const saveButton = event.target.closest('[data-save]');
      if (saveButton) {
        saveButton.parentElement.querySelector('[data-confirm]').hidden = false;
        return;
      }

      const noteButton = event.target.closest('[data-select-note]');
      if (noteButton) {
        activeNote = activeNote === noteButton.dataset.selectNote ? null : noteButton.dataset.selectNote;
        prototype.querySelectorAll('[data-note]').forEach((element) => element.classList.toggle('bk2-highlight', element.dataset.note === activeNote));
        renderNotes();
      }
    });

    notesToggle.addEventListener('change', () => {
      prototype.classList.toggle('bk2-annotations', notesToggle.checked);
      activeNote = null;
      prototype.querySelectorAll('[data-note]').forEach((element) => element.classList.remove('bk2-highlight'));
      renderNotes();
    });

    render();
  })();
</script>
