            &lt;label class=&quot;bk-field-label&quot; for=&quot;bk-add-search&quot;&gt;&lt;span class=&quot;bk-add-field-name&quot;&gt;Title or author&lt;/span&gt;&lt;/label&gt;&lt;input id=&quot;bk-add-search&quot; class=&quot;bk-field&quot; type=&quot;search&quot; placeholder=&quot;Try The Snowy Day&quot;&gt;

            &lt;fieldset class=&quot;bk-status-choice&quot;&gt;&lt;legend&gt;Where does this book belong?&lt;/legend&gt;&lt;div class=&quot;bk-status-options&quot;&gt;&lt;button class=&quot;bk-status-option&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Owned&lt;/button&gt;&lt;button class=&quot;bk-status-option&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Borrowed&lt;/button&gt;&lt;button class=&quot;bk-status-option&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Wishlist&lt;/button&gt;&lt;/div&gt;&lt;/fieldset&gt;
            &lt;div class=&quot;bk-inline-state bk-add-state&quot; role=&quot;alert&quot;&gt;We couldn&amp;rsquo;t look up that book. Nothing was added. Try again.&lt;/div&gt;

          &lt;/div&gt;

        &lt;div class=&quot;bk-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;bk-toast-row&quot;&gt;&lt;strong&gt;Reading moment saved.&lt;/strong&gt;&lt;button class=&quot;bk-log-another&quot; type=&quot;button&quot;&gt;Log another&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;sr-only bk-live&quot; aria-live=&quot;assertive&quot;&gt;&lt;/div&gt;

    &lt;aside class=&quot;review-panel&quot; aria-label=&quot;Design comments&quot;&gt;
      &lt;h2&gt;Design comments&lt;/h2&gt;&lt;p&gt;Select a comment to highlight the related decision in the proposed interface.&lt;/p&gt;
      &lt;div class=&quot;comment-list&quot;&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;identity&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Two Bright Snap directions&lt;/strong&gt;&lt;span&gt;Switch between the original graphic camera language and the warmer editorial refinement without changing the product flow.&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;hierarchy&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Parent-polished hierarchy&lt;/strong&gt;&lt;span&gt;Fraunces and Manrope pair character with fast scanning; decorations remain restrained.&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;collection&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;A shelf that can grow&lt;/strong&gt;&lt;span&gt;Search and mutually exclusive status filters stay visible; test wrap or horizontal scroll on phone.&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;quick-action&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;One lens, two actions&lt;/strong&gt;&lt;span&gt;The lighter camera-lens button opens explicit actions. Test whether Log or Add should sit nearest the thumb.&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;quick-log&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Fast, truthful repeat logging&lt;/strong&gt;&lt;span&gt;Search the whole shelf, choose explicitly, save, then use the real Log another action.&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;add-book&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Honest Add Book&lt;/strong&gt;&lt;span&gt;Verified metadata and a required shelf status precede confirmation. Camera scanning remains later work.&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;comment&quot; type=&quot;button&quot; data-comment=&quot;history&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Origin-aware book history&lt;/strong&gt;&lt;span&gt;Book history opens only that title. Back returns to Shelf or History based on where the book was opened; the top navigation remains the direct path to household History.&lt;/span&gt;&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;review-detail&quot; role=&quot;status&quot;&gt;Choose a comment or use the controls above to inspect open design decisions and recovery states.&lt;/div&gt;
    &lt;/aside&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;bookkin5a&#x27;);
      if (!root) return;
      const shell = root.querySelector(&#x27;.bk-shell&#x27;);
      const fab = root.querySelector(&#x27;.bk-fab&#x27;);
      const options = root.querySelector(&#x27;.bk-fab-options&#x27;);
      const live = root.querySelector(&#x27;.bk-live&#x27;);
      let baseScene = &#x27;shelf&#x27;;
      let lastFocus = fab;
      let activeDialog = null;
      let addMatched = false;
      let historyReturnTarget = null;
      let historyOrigin = &#x27;history&#x27;;
      let historyReturnScrollY = 0;
      let detailHistoryActive = false;
      let pendingPrimaryNav = null;
      const shelfCoverImages = [...root.querySelectorAll(&#x27;.bk-cover-feature img&#x27;)];
      root.querySelectorAll(&#x27;.bk-mini-cover img&#x27;).forEach((image, index) =&gt; { image.src = shelfCoverImages[index]?.src || &#x27;&#x27;; });

      const announce = (message) =&gt; { live.textContent = &#x27;&#x27;; requestAnimationFrame(() =&gt; { live.textContent = message; }); };
      const setPressed = (selector, active) =&gt; root.querySelectorAll(selector).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button === active)));
      const historyBookTitles = { snowy: &#x27;The Snowy Day&#x27;, market: &#x27;Last Stop on Market Street&#x27;, wild: &#x27;Where the Wild Things Are&#x27; };
      const historyBookKeys = { &#x27;The Snowy Day&#x27;: &#x27;snowy&#x27;, &#x27;Last Stop on Market Street&#x27;: &#x27;market&#x27;, &#x27;Where the Wild Things Are&#x27;: &#x27;wild&#x27; };
      const showAllHistory = () =&gt; {
        root.dataset.historyMode = &#x27;all&#x27;;
        delete root.dataset.historyBook;
        historyOrigin = &#x27;history&#x27;;
        historyReturnTarget = null;
      };
      const showBookHistory = (key, returnTarget = null, origin = &#x27;history&#x27;, pushEntry = true) =&gt; {
        historyReturnTarget = returnTarget || root.querySelector(`[data-history-open=&quot;${key}&quot;]`) || root.querySelector(&#x27;[data-nav=&quot;history&quot;]&#x27;);
        historyOrigin = origin;
        historyReturnScrollY = window.scrollY;
        root.dataset.historyBook = key;
        root.dataset.historyMode = key === &#x27;wild&#x27; ? &#x27;empty&#x27; : &#x27;detail&#x27;;
        root.querySelectorAll(&#x27;.bk-history-book-title&#x27;).forEach((title) =&gt; { title.textContent = historyBookTitles[key]; });
        root.querySelectorAll(&#x27;.bk-history-back&#x27;).forEach((button) =&gt; { button.textContent = origin === &#x27;shelf&#x27; ? &#x27;Back to Shelf&#x27; : &#x27;Back to History&#x27;; });
        if (pushEntry) window.history.pushState({ bookkin5aDetail: true, key, origin }, &#x27;&#x27;, window.location.href);
        detailHistoryActive = true;
        requestAnimationFrame(() =&gt; root.querySelector(key === &#x27;wild&#x27; ? &#x27;.bk-history-empty .bk-history-back&#x27; : &#x27;.bk-history-detail .bk-history-back&#x27;)?.focus());
      };
      const returnFromBookHistory = () =&gt; {
        const returnTarget = historyReturnTarget;
        const returnOrigin = historyOrigin;
        const returnScrollY = historyReturnScrollY;
        detailHistoryActive = false;
        if (pendingPrimaryNav) {
          const destination = pendingPrimaryNav;
          pendingPrimaryNav = null;
          if (destination === &#x27;history&#x27;) showAllHistory();
          setScene(destination);
          requestAnimationFrame(() =&gt; root.querySelector(`[data-nav=&quot;${destination}&quot;]`)?.focus());
          return;
        }
        showAllHistory();
        if (returnOrigin === &#x27;shelf&#x27;) setScene(&#x27;shelf&#x27;);
        requestAnimationFrame(() =&gt; {
          const fallback = returnOrigin === &#x27;shelf&#x27; ? root.querySelector(&#x27;.bk-shelf-search&#x27;) : root.querySelector(&#x27;[data-nav=&quot;history&quot;]&#x27;);
          const target = returnTarget?.isConnected ? returnTarget : fallback;
          target?.focus({ preventScroll: true });
          window.scrollTo({ top: returnScrollY, behavior: &#x27;auto&#x27; });
        });
      };
      const syncActionOrder = () =&gt; {
        const nearest = options.querySelector(root.dataset.order === &#x27;log-first&#x27; ? &#x27;[data-open=&quot;log&quot;]&#x27; : &#x27;[data-open=&quot;add&quot;]&#x27;);
        const other = options.querySelector(root.dataset.order === &#x27;log-first&#x27; ? &#x27;[data-open=&quot;add&quot;]&#x27; : &#x27;[data-open=&quot;log&quot;]&#x27;);
        options.append(nearest, other);
      };
      const resetLog = () =&gt; {
        root.querySelector(&#x27;.bk-log-search&#x27;).value = &#x27;&#x27;;
        root.querySelectorAll(&#x27;.bk-pick, .bk-event, .bk-reaction&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
        root.querySelectorAll(&#x27;.bk-pick&#x27;).forEach((button) =&gt; { button.hidden = false; });
        root.querySelector(&#x27;.bk-log-empty&#x27;).style.display = &#x27;none&#x27;;
        root.querySelector(&#x27;.bk-log-error&#x27;).style.removeProperty(&#x27;display&#x27;);
        root.querySelector(&#x27;.bk-save-log&#x27;).disabled = true;
        root.querySelector(&#x27;.bk-dialog-log details&#x27;).open = false;
      };
      const resetAdd = () =&gt; {
        const input = root.querySelector(&#x27;#bk-add-search&#x27;);
        input.value = &#x27;&#x27;;
        addMatched = false;
        root.querySelector(&#x27;.bk-search-result&#x27;).style.display = &#x27;none&#x27;;
        root.querySelector(&#x27;.bk-status-choice&#x27;).style.display = &#x27;none&#x27;;
        root.querySelectorAll(&#x27;.bk-status-option&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
        root.querySelector(&#x27;.bk-add-confirm&#x27;).disabled = true;
      };
      const setScene = (value, fromControl = false) =&gt; {
        if (value === &#x27;shelf&#x27; || value === &#x27;history&#x27;) {
          baseScene = value;
          root.dataset.baseScene = value;
        }
        root.dataset.scene = value;
        root.querySelectorAll(&#x27;[data-set=&quot;scene&quot;]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.value === value)));
        root.querySelectorAll(&#x27;[data-nav]&#x27;).forEach((button) =&gt; {
          const active = button.dataset.nav === (value === &#x27;history&#x27; ? &#x27;history&#x27; : baseScene);
          if (active) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
          else button.removeAttribute(&#x27;aria-current&#x27;);
        });
        const fanOpen = value === &#x27;actions&#x27; || value === &#x27;offline&#x27;;
        fab.setAttribute(&#x27;aria-expanded&#x27;, String(fanOpen));
        options.hidden = !fanOpen;
        options.querySelectorAll(&#x27;button&#x27;).forEach((button) =&gt; { button.disabled = value === &#x27;offline&#x27;; });
        if (value === &#x27;offline&#x27;) announce(&#x27;Bookkin is offline. Reconnect before saving or adding. Nothing has changed.&#x27;);
        if (fromControl &amp;&amp; (value === &#x27;quick-log&#x27; || value === &#x27;add-book&#x27;)) openDialog(value === &#x27;quick-log&#x27; ? &#x27;log&#x27; : &#x27;add&#x27;, document.activeElement);
      };
      const openDialog = (kind, trigger) =&gt; {
        lastFocus = fab;
        if (kind === &#x27;log&#x27;) {
          resetLog();
          root.querySelector(&#x27;.bk-toast strong&#x27;).textContent = &#x27;Reading moment saved.&#x27;;
          root.querySelector(&#x27;.bk-log-another&#x27;).hidden = false;
        } else resetAdd();
        activeDialog = root.querySelector(kind === &#x27;log&#x27; ? &#x27;.bk-dialog-log&#x27; : &#x27;.bk-dialog-add&#x27;);
        root.dataset.scene = kind === &#x27;log&#x27; ? &#x27;quick-log&#x27; : &#x27;add-book&#x27;;
        root.querySelectorAll(&#x27;[data-set=&quot;scene&quot;]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.value === root.dataset.scene)));
        shell.setAttribute(&#x27;inert&#x27;, &#x27;&#x27;);
        requestAnimationFrame(() =&gt; activeDialog.querySelector(kind === &#x27;log&#x27; ? &#x27;.bk-log-search&#x27; : &#x27;#bk-add-search&#x27;).focus());
      };
      const closeDialog = (reset = true) =&gt; {
        if (!activeDialog) return;
        if (reset) activeDialog.classList.contains(&#x27;bk-dialog-log&#x27;) ? resetLog() : resetAdd();
        activeDialog = null;
        shell.removeAttribute(&#x27;inert&#x27;);
        setScene(baseScene);
        requestAnimationFrame(() =&gt; lastFocus?.focus());
      };

      root.querySelectorAll(&#x27;[data-set]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const name = button.dataset.set;
        const value = button.dataset.value;
        if (name === &#x27;scene&#x27;) { if (activeDialog) closeDialog(); if (value === &#x27;history&#x27;) showAllHistory(); setScene(value, true); return; }
        root.dataset[name] = value;
        if (name === &#x27;order&#x27;) syncActionOrder();
        root.querySelectorAll(`[data-set=&quot;${name}&quot;]`).forEach((peer) =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, String(peer === button)));
      }));
