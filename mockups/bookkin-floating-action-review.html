<div id="bookkin-floating-action-review">
  <div class="viz-controls" aria-label="Prototype controls">
    <span class="text-small text-muted">Screen</span>
    <button class="btn btn-primary" type="button" data-screen="shelf" aria-pressed="true">Shelf</button>
    <button class="btn" type="button" data-screen="history" aria-pressed="false">Book history</button>
    <span class="text-small text-muted">Viewport</span>
    <button class="btn btn-primary" type="button" data-viewport="desktop" aria-pressed="true">Desktop</button>
    <button class="btn" type="button" data-viewport="phone" aria-pressed="false">Phone</button>
    <label class="form-check form-switch">
      <input class="form-check-input" id="bk3-notes-toggle" type="checkbox" checked>
      <span class="form-check-label">Design notes</span>
    </label>
  </div>

  <div class="bk3-review-layout">
    <div class="bk3-stage">
      <div class="bk3-device bk3-desktop" data-device>
        <div class="bk3-product" data-product aria-live="polite"></div>
      </div>
    </div>
    <aside class="card bk3-notes" aria-label="Design comments">
      <p class="text-small text-muted">Select a comment to highlight its decision.</p>
      <div data-notes></div>
    </aside>
  </div>
</div>

<style>

  #bookkin-floating-action-review .bk3-fab-action:first-child {
    border-color: var(--bk3-green);
  }

  #bookkin-floating-action-review .bk3-fab {
    width: 3.7rem;
    height: 3.7rem;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 999px;
    background: var(--bk3-green);

    box-shadow: 0 12px 30px light-dark(rgb(19 75 57 / 0.28), rgb(0 0 0 / 0.44));
    font: inherit;

    cursor: pointer;
    transition: transform 130ms ease;
  }

  #bookkin-floating-action-review .bk3-fab[aria-expanded="true"] {

  }

  #bookkin-floating-action-review .bk3-backdrop {

  #bookkin-floating-action-review .bk3-modal-head {
    display: flex;
    align-items: start;
    gap: 1rem;

    flex: 1;
  }

  #bookkin-floating-action-review .bk3-close {

  }

  #bookkin-floating-action-review .bk3-tabs,
  #bookkin-floating-action-review .bk3-choice-grid,
  #bookkin-floating-action-review .bk3-recent-grid {

  #bookkin-floating-action-review .bk3-tabs {

  #bookkin-floating-action-review .bk3-tab {

  #bookkin-floating-action-review .bk3-tab[aria-selected="true"] {

    color: var(--bk3-ink);
  }

  #bookkin-floating-action-review .bk3-recent-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  #bookkin-floating-action-review .bk3-recent,
  #bookkin-floating-action-review .bk3-choice {

  }

  #bookkin-floating-action-review .bk3-recent[aria-pressed="true"],
  #bookkin-floating-action-review .bk3-choice[aria-pressed="true"] {

  }

  #bookkin-floating-action-review .bk3-choice-grid {

  #bookkin-floating-action-review .bk3-label {

  }

    border-radius: 999px;

    color: var(--bk3-green-ink);
    box-shadow: 0 -8px 18px var(--bk3-surface);

    font-weight: 500;
    cursor: pointer;
  }

  #bookkin-floating-action-review .bk3-confirm {
    margin: 0.65rem 0 0;
    color: var(--bk3-green-strong);
    font-size: 0.78rem;
  }

  #bookkin-floating-action-review .bk3-phone .bk3-header {
    flex-wrap: wrap;
  }

  #bookkin-floating-action-review .bk3-phone .bk3-page {
    padding: 1rem 1rem 5.5rem;
  }

  #bookkin-floating-action-review .bk3-phone .bk3-tools {
    grid-template-columns: 1fr;
  }

  #bookkin-floating-action-review .bk3-phone .bk3-filters {
    overflow: hidden;
  }

  #bookkin-floating-action-review .bk3-phone .bk3-filter {
    flex: 1;

  }

  #bookkin-floating-action-review .bk3-phone .bk3-grid {

<script>
  (() => {
    const root = document.getElementById('bookkin-floating-action-review');
    const product = root.querySelector('[data-product]');
    const device = root.querySelector('[data-device]');
    const notesRegion = root.querySelector('[data-notes]');
    const notesToggle = root.querySelector('#bk3-notes-toggle');
    let screen = 'shelf';
    let viewport = 'desktop';
    let menuOpen = false;
    let modal = null;
    let activeNote = null;

    const notes = {
      base: [
        ['1', 'One circular action stays on the lower right and avoids the heavy pill-dock appearance.'],
        ['2', 'Tapping it fans out two explicit actions; labels appear only when needed.'],
        ['3', '“Log a read” is first in the fan because it is expected to be the more frequent action.'],
        ['4', 'The fan collapses before either focused modal opens, leaving one task on screen.']
      ],
      add: [
        ['1', 'Add a book opens the same focused modal or mobile sheet from every screen.'],
        ['2', 'ISBN, title, and author remain the currently implemented verified paths.'],
        ['3', 'Camera scanning joins this flow in Checkpoint 9 without appearing as a dead action now.']
      ],
      log: [
        ['1', 'Log a read opens directly to recent books plus shelf search.'],
        ['2', 'The common finish-and-react path stays inside one focused sheet.'],
        ['3', 'The save action remains reachable at the bottom edge even if smaller phones need internal overflow.']
      ]
    };

    const books = [
      ['The Snowy Day', 'Ezra Jack Keats', 'Owned'],
      ['More Pies!', 'Robert Munsch', 'Borrowed'],
      ['Last Stop on Market', 'Matt de la Peña', 'Wishlist'],
      ['Saturday', 'Oge Mora', 'Owned'],
      ['The Rabbit Listened', 'Cori Doerrfeld', 'Borrowed'],
      ['Jabari Jumps', 'Gaia Cornwall', 'Wishlist'],
      ['The Dot', 'Peter H. Reynolds', 'Owned'],
      ['A Sick Day for Amos McGee', 'Philip C. Stead', 'Owned']
    ];

    const fab = () => `
      <div class="bk3-fab-wrap" data-note="1">
        <div class="bk3-fab-menu" ${menuOpen ? '' : 'hidden'} data-note="2">
          <button class="bk3-fab-action" type="button" data-open="log" data-note="3">Log a read</button>
          <button class="bk3-fab-action" type="button" data-open="add">Add a book</button>
        </div>
        <button class="bk3-fab" type="button" data-toggle-menu aria-expanded="${menuOpen}" aria-label="${menuOpen ? 'Close quick actions' : 'Open quick actions'}">＋</button>
      </div>
    `;

    const header = () => `
      <header class="bk3-header">
        <div class="bk3-brand">Bookkin</div>
        <button type="button" data-go="shelf">Shelf</button>
        <span class="bk3-alpha">Private alpha</span>
      </header>
    `;

    const shelf = () => `
      ${header()}
      <main class="bk3-page">
        <p class="bk3-kicker">Family shelf</p>
        <h1 class="bk3-title">Books worth remembering.</h1>
        <span class="bk3-meta">8 books</span>
        <div class="bk3-tools">
          <input class="bk3-search" type="search" placeholder="Search title or author">
          <div class="bk3-filters">
            <button class="bk3-filter" type="button" aria-pressed="true">All</button>
            <button class="bk3-filter" type="button" aria-pressed="false">Owned</button>
            <button class="bk3-filter" type="button" aria-pressed="false">Borrowed</button>
            <button class="bk3-filter" type="button" aria-pressed="false">Wishlist</button>
          </div>
        </div>
        <section class="bk3-grid" aria-label="Family books">
          ${books.map(([title, author, status]) => `
            <button class="bk3-book" type="button" data-go="history">
              <span class="bk3-cover">Verified provider cover</span>
              <span class="bk3-book-title">${title}</span>
              <span class="bk3-meta">${author}</span>
              <span class="bk3-chip">${status}</span>
            </button>
          `).join('')}
        </section>
      </main>
      ${fab()}
    `;

    const history = () => `
      ${header()}
      <main class="bk3-page">
        <p class="bk3-kicker">Reading history</p>
        <h1 class="bk3-title">A small record of what happened.</h1>
        <section class="bk3-history-grid">
          <div class="bk3-cover">More Pies!<br>Cover unavailable</div>
          <div>
            <p class="bk3-kicker">Family book</p>
            <h2>More Pies!</h2>
            <span class="bk3-meta">Robert Munsch</span>
            <span class="bk3-chip">Borrowed</span>
            <span class="bk3-chip">1 reread</span>
          </div>
        </section>
        <section class="bk3-timeline">
          <p class="bk3-kicker">Activity</p>
          <h2>What your family remembers.</h2>
          <article class="bk3-event">
            <span class="bk3-meta">Aug 7, 2026</span>
            <strong>Read again</strong>
            <span class="bk3-meta">Child: Love · Parent: Love</span>
          </article>
        </section>
      </main>
      ${fab()}
    `;

    const addModal = () => `
      <div class="bk3-backdrop" data-backdrop>
        <section class="bk3-modal" role="dialog" aria-modal="true" aria-labelledby="bk3-add-heading" data-note="1">
          <div class="bk3-modal-head">
            <div><p class="bk3-kicker">Add a book</p><h2 id="bk3-add-heading">Find a verified record.</h2></div>
            <button class="bk3-close" type="button" data-close>Close</button>
          </div>
          <div class="bk3-tabs" role="tablist" data-note="2">
            <button class="bk3-tab" type="button" data-tab="ISBN" aria-selected="true">ISBN</button>
            <button class="bk3-tab" type="button" data-tab="Title" aria-selected="false">Title</button>
            <button class="bk3-tab" type="button" data-tab="Author" aria-selected="false">Author</button>
          </div>
          <label class="bk3-label" for="bk3-add-search">ISBN-10 or ISBN-13</label>
          <input class="bk3-search" id="bk3-add-search" placeholder="978-0-306-40615-7">
          <p class="bk3-meta" data-note="3">Camera barcode scanning joins this same flow in Checkpoint 9.</p>
          <button class="bk3-primary" type="button" data-save>Look up book</button>
          <p class="bk3-confirm" data-confirm hidden>Prototype: verified result would appear here.</p>
        </section>
      </div>
    `;

    const logModal = () => `
      <div class="bk3-backdrop" data-backdrop>
        <section class="bk3-modal" role="dialog" aria-modal="true" aria-labelledby="bk3-log-heading" data-note="1">
          <div class="bk3-modal-head">
            <div><p class="bk3-kicker">Log a read</p><h2 id="bk3-log-heading">What happened?</h2></div>
            <button class="bk3-close" type="button" data-close>Close</button>
          </div>
          <label class="bk3-label" for="bk3-log-search">Recent books or shelf search</label>
          <input class="bk3-search" id="bk3-log-search" placeholder="Search title or author">
          <div class="bk3-recent-grid">
            <button class="bk3-recent" type="button" aria-pressed="true">More Pies!</button>
            <button class="bk3-recent" type="button" aria-pressed="false">The Snowy Day</button>
            <button class="bk3-recent" type="button" aria-pressed="false">Saturday</button>
          </div>
          <div data-note="2">
            <span class="bk3-label">Reading event</span>
            <div class="bk3-choice-grid">
              <button class="bk3-choice" type="button" aria-pressed="true">Finished</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Read again</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Stopped</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Rejected</button>
            </div>
            <span class="bk3-label">Child’s reaction</span>
            <div class="bk3-choice-grid">
              <button class="bk3-choice" type="button" aria-pressed="false">Love</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Like</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Not for me</button>
            </div>
            <span class="bk3-label">Parent’s reaction</span>
            <div class="bk3-choice-grid">
              <button class="bk3-choice" type="button" aria-pressed="false">Love</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Like</button>
              <button class="bk3-choice" type="button" aria-pressed="false">Dislike</button>
            </div>
          </div>
          <button class="bk3-primary" type="button" data-save data-note="3">Save reading moment</button>
          <p class="bk3-confirm" data-confirm hidden>Prototype: reading moment saved.</p>
        </section>
      </div>
    `;

    function currentNotes() {
      return notes[modal || 'base'];
    }

    function renderNotes() {
      notesRegion.innerHTML = currentNotes().map(([number, text]) => `
        <button class="btn btn-ghost bk3-note-button" type="button" data-select-note="${number}" aria-pressed="${activeNote === number}">
          <strong>${number}.</strong>&nbsp;${text}
        </button>
      `).join('');
      root.querySelector('.bk3-notes').hidden = !notesToggle.checked;
    }

    function render() {
      product.innerHTML = screen === 'shelf' ? shelf() : history();
      if (modal === 'add') product.insertAdjacentHTML('beforeend', addModal());
      if (modal === 'log') product.insertAdjacentHTML('beforeend', logModal());
      product.classList.toggle('bk3-annotations', notesToggle.checked);
      device.className = `bk3-device bk3-${viewport}`;
      activeNote = null;
      renderNotes();
    }

    function chooseScreen(next) {
      screen = next;
      menuOpen = false;
      modal = null;
      root.querySelectorAll('[data-screen]').forEach((button) => {
        const selected = button.dataset.screen === next;
        button.setAttribute('aria-pressed', String(selected));
        button.classList.toggle('btn-primary', selected);
      });
      render();
    }

    root.addEventListener('click', (event) => {
      const screenButton = event.target.closest('[data-screen]');
      if (screenButton) {
        chooseScreen(screenButton.dataset.screen);
        return;
      }

      const viewportButton = event.target.closest('[data-viewport]');
      if (viewportButton) {
        viewport = viewportButton.dataset.viewport;
        root.querySelectorAll('[data-viewport]').forEach((button) => {
          const selected = button.dataset.viewport === viewport;
          button.setAttribute('aria-pressed', String(selected));
          button.classList.toggle('btn-primary', selected);
        });
        render();
        return;
      }

      const screenLink = event.target.closest('[data-go]');
      if (screenLink) {
        chooseScreen(screenLink.dataset.go);
        return;
      }

      if (event.target.closest('[data-toggle-menu]')) {
        menuOpen = !menuOpen;
        render();
        return;
      }

      const openButton = event.target.closest('[data-open]');
      if (openButton) {
        menuOpen = false;
        modal = openButton.dataset.open;
        render();
        return;
      }

      if (event.target.closest('[data-close]') || event.target.matches('[data-backdrop]')) {
        modal = null;
        render();
        return;
      }

      const tab = event.target.closest('[data-tab]');
      if (tab) {
        const dialog = tab.closest('.bk3-modal');
        dialog.querySelectorAll('[data-tab]').forEach((button) => button.setAttribute('aria-selected', String(button === tab)));
        const values = {
          ISBN: ['ISBN-10 or ISBN-13', '978-0-306-40615-7', 'Look up book'],
          Title: ['Book title', 'The Snowy Day', 'Search by title'],
          Author: ['Author name', 'Ezra Jack Keats', 'Search by author']
        };
        const label = dialog.querySelector('.bk3-label');
        const input = dialog.querySelector('.bk3-search');
        const save = dialog.querySelector('[data-save]');
        [label.textContent, input.placeholder, save.textContent] = values[tab.dataset.tab];
        return;
      }

      const selectable = event.target.closest('.bk3-choice, .bk3-recent, .bk3-filter');
      if (selectable) {
        selectable.parentElement.querySelectorAll('.bk3-choice, .bk3-recent, .bk3-filter').forEach((button) => button.setAttribute('aria-pressed', String(button === selectable)));
        return;
      }

      const saveButton = event.target.closest('[data-save]');
      if (saveButton) {
        saveButton.parentElement.querySelector('[data-confirm]').hidden = false;
        return;
      }

      const noteButton = event.target.closest('[data-select-note]');
      if (noteButton) {
        activeNote = activeNote === noteButton.dataset.selectNote ? null : noteButton.dataset.selectNote;
        product.querySelectorAll('[data-note]').forEach((element) => element.classList.toggle('bk3-highlight', element.dataset.note === activeNote));
        renderNotes();
      }
    });

    notesToggle.addEventListener('change', () => {
      product.classList.toggle('bk3-annotations', notesToggle.checked);
      activeNote = null;
      product.querySelectorAll('[data-note]').forEach((element) => element.classList.remove('bk3-highlight'));
      renderNotes();
    });

    render();
  })();
</script>
